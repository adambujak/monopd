[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "monopd"
version = "0.1.0"
description = "Monopoly Deal engine (Rust) for Python"
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]

# Rebuild the module whenever the bindings or the engine change.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../engine/Cargo.toml" },
    { file = "../engine/src/**/*.rs" },
]
